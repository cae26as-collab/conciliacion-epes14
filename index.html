<script>
/* ============ ESTADO / API ============ */
let API = localStorage.getItem('conc_api')||'';
let TOKEN = localStorage.getItem('conc_token')||'';
let ROL = localStorage.getItem('conc_rol')||'consulta';
let BD = null;
const PLAN_MAP = {'CBS (672/19)':'CBS-672','BCS':'BCS','BCN':'BCN','BEA':'BEA','BEA-EPJA':'BEA-EPJA'};
const PLAN_INV = Object.fromEntries(Object.entries(PLAN_MAP).map(([a,b])=>[b,a]));
const DIVS = {'CBS-672':{'1°':['I','II','III','IV','V'],'2°':['I','II','III','IV'],'3°':['I','II','III']}};
function msg(t,ms=3800){const m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',ms);}
/* ============ INDICADOR DE PROGRESO / BLOQUEO DE BOTONES ============ */
let BUSY=0;
function setBusy(on){BUSY+=on?1:-1;if(BUSY<0)BUSY=0;const b=document.getElementById('busybar');if(b)b.style.display=BUSY>0?'block':'none';}
/** Envuelve una acción (guardar/editar/borrar/generar): deshabilita el elemento que la disparó
 *  y muestra el indicador de progreso mientras corre, para evitar doble clic. */
async function accion(el, fn){
  if(el){ el.dataset.orig=el.dataset.orig??el.innerHTML; el.style.pointerEvents='none'; el.style.opacity='.55'; if('disabled' in el) el.disabled=true; el.innerHTML='⏳ '+el.dataset.orig; }
  setBusy(true);
  try{ await fn(); }
  finally{ setBusy(false); if(el){ el.style.pointerEvents=''; el.style.opacity=''; if('disabled' in el) el.disabled=false; el.innerHTML=el.dataset.orig; } }
}
async function apiGet(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));setBusy(true);try{const j=await(await fetch(u)).json();if(j.error==='SESION'){salir();throw new Error('Sesión vencida')}return j;}finally{setBusy(false);}}
async function apiPost(b){b.token=TOKEN;setBusy(true);try{const j=await(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)})).json();if(j.error==='SESION'){salir();throw new Error('Sesión vencida')}if(!j.ok)throw new Error(j.error||'Error');return j;}finally{setBusy(false);}}
function cols(e){return BD[e]?.cols||[];} function filas(e){return BD[e]?.filas||[];}
function ix(e,n){return cols(e).indexOf(n);}
function hsNum(v){const n=String(v??'').match(/\d+(?:[.,]\d+)?/g);return n?n.reduce((a,c)=>a+parseFloat(c.replace(',','.')),0):0;}
function unNum(v){const m=String(v??'').match(/\d+(?:[.,]\d+)?/);return m?parseFloat(m[0].replace(',','.')):0;}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function deacc(s){return String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'');}
function normE(s){return deacc(String(s??'')).toUpperCase().replace(/[^A-ZN0-9]/g,'');}
function cupKey(s){
  let x=deacc(String(s??'')).toUpperCase();
  x=x.replace(/\([^)]*\)/g,''); // quita anotaciones entre paréntesis
  // quita palabras de situación/anotación pegadas al final (p.ej. "...-CBS-3 INTERINO")
  x=x.replace(/[\s\-]*\b(INTERINO|SUPLENTE|TITULAR|VACANTE)\b\.?/g,'');
  x=x.replace(/\s+/g,'');
  const m=x.match(/\d{0,4}53200[-A-ZN0-9/.:]+/); // incluye ":" (EDI:A / EDI:B)
  if(!m)return '';
  x=m[0];
  x='0053200'+x.slice(x.indexOf('53200')+5);
  return x.replace(/-{2,}/g,'-').replace(/[-/.:]+$/,'');
}
/** Carga (horas) codificada en el propio texto de la CUPOF: el número que sigue a "GH" si existe
 *  (GH4→4, GH8→8), si no el número final antes del /sufijo (típico de PHC individuales: "...-CBOI-3"→3).
 *  Devuelve null si no puede interpretarlo. */
function cargaDesdeCupof(s){
  const x=deacc(String(s??'')).toUpperCase().replace(/\s+/g,'');
  const mGH=x.match(/GH(\d+)(?:\/\d+)?$/);
  if(mGH)return Number(mGH[1]);
  const mFin=x.match(/-(\d+)(?:\/\d+)?$/);
  if(mFin)return Number(mFin[1]);
  return null;
}
/** Quita todo espacio interno del texto de una CUPOF (no debe haber espacios entre guiones ni
 *  dentro del nombre del espacio curricular). No toca el separador entre varias CUPOF pegadas:
 *  usar SIEMPRE después de dividir, sobre una sola CUPOF por celda. */
function compactarCupof(s){return String(s??'').replace(/\s+/g,'');}
/** Descompone una CUPOF (ya pasada por cupKey) en sus componentes estructurales, ignorando el
 *  nombre del espacio (que es texto libre y puede tener variantes de abreviatura/ortografía).
 *  Sirve para agrupar y detectar si dos textos distintos son en realidad la misma CUPOF. */
function estructuraCupof(s){
  const k=cupKey(s); if(!k)return null;
  const partes=k.split('-');
  if(partes.length<7)return null;
  const n=partes.length;
  const carga=partes[n-1], plan=partes[n-2], turno=partes[n-3], div=partes[n-4], curso=partes[n-5];
  const tipo=partes[1];
  const espacio=partes.slice(2,n-5).join('-');
  return {tipo,espacio,curso,div,turno,plan,carga,estructural:[tipo,curso,div,turno,plan,carga].join('|')};
}

/* ============ MATCHER DE ESPACIOS ============ */
const ALIAS={'STGEOGRAFIA':'SEMINARIOSOTALLERESDEGEOGRAFIA','STHISTORIA':'SEMINARIOSOTALLERESDEHISTORIA',
'SLFISICOQUIMICA':'SEMINARIOSOLABORATORIOSDEFISICOQUIMICA','SLBIOLOGIA':'SEMINARIOSOLABORATORIOSDEBIOLOGIA',
'FEYCOMPCOM':'FORMACIONETICAYCOMPROMISOCOMUNITARIO','FEYCOMPCOMUNITARIO':'FORMACIONETICAYCOMPROMISOCOMUNITARIO',
'FETICAYCOMPCOM':'FORMACIONETICAYCOMPROMISOCOMUNITARIO','TUTORIA':'TUTORIAFORTALECIMIENTODELESTUDIANTE',
'FETICAYCIUDYPDEVIDA':'FEYCIUDADANAYPROYECTODEVIDA','EDARTISTICA':'EDUCACIONARTISTICA','EDUCARTISTICA':'EDUCACIONARTISTICA',
'EDFISICA':'EDUCACIONFISICA','EDUCFISICA':'EDUCACIONFISICA','LENGEXT':'LENGUAEXTRANJERA','LENGUAEXT':'LENGUAEXTRANJERA',
'STGEOGRAFIA':'SEMINARIOSOTALLERESDEGEOGRAFIA','SLFISICOQUIMICA':'SEMINARIOSOLABORATORIOSDEFISICOQUIMICA'};
function sim3(a,b){if(a.length<3)return a===b?1:0;let s=0;for(let i=0;i<a.length-2;i++)if(b.includes(a.substr(i,3)))s++;return s/(a.length-2);}
function matchEspacio(nombre, caja){ // caja: [{nom, n}]
  let n=normE(nombre); n=ALIAS[n]||n;
  // reglas duras
  if(/LENG/.test(n)&&/EXT|INGLES/.test(n)) return caja.find(c=>/EXTRANJER/.test(c.n))||null;
  if(/ETICA|CIUDADAN/.test(n)) return caja.find(c=>/ETICA|CIUDADAN|COMPROMISO/.test(c.n))||null;
  let f=caja.find(c=>c.n===n); if(f)return f;
  const strip=x=>x.replace(/(III|II|IV|VI|V|I)$/,'');
  const ns=strip(n);
  const elegibles=caja.filter(c=>!(/EXTRANJER/.test(c.n)&&!/EXT/.test(n)));
  // contención solo si el nombre más corto tiene al menos 5 letras (evita que "TIC" matchee dentro de "éTICa")
  let cand=elegibles.filter(c=>{const cs=strip(c.n);if(cs===ns)return true;
    if(Math.min(cs.length,ns.length)<5)return false;
    return cs.startsWith(ns)||ns.startsWith(cs)||cs.includes(ns)||ns.includes(cs);});
  if(cand.length===1)return cand[0];
  if(cand.length>1){const ex=cand.find(c=>strip(c.n)===ns);if(ex)return ex;}
  let mejor=null,pm=0;
  elegibles.forEach(c=>{const p=Math.max(sim3(ns,strip(c.n)),sim3(strip(c.n),ns));if(p>pm){pm=p;mejor=c;}});
  return pm>=0.55?mejor:null;
}
function cajaDe(plan,curso,inclFuera){const iEp=ix('ESPACIOS','PLAN'),iEc=ix('ESPACIOS','CURSO'),iEe=ix('ESPACIOS','ESPACIO CURRICULAR'),iEh=ix('ESPACIOS','HS SEM.'),iEf=ix('ESPACIOS','FUERA DE CAJA');
  return filas('ESPACIOS').filter(f=>f[iEp]===plan&&String(f[iEc])===String(curso)&&(inclFuera||f[iEf]!=='Sí'))
    .map(f=>({nom:f[iEe],n:normE(f[iEe]),hs:unNum(f[iEh]),fuera:f[iEf]==='Sí'}));}

/* ============ SALDOS DE CUPOF ============ */
/** Una CUPOF cuenta para carga/disponibilidad salvo que su ESTADO diga explícitamente otra cosa que
 *  no sea "Vigente" (ej.: "No autorizada..." — solicitada al Ministerio pero rechazada). Estas CUPOF
 *  siguen existiendo en la hoja CUPOF como registro, pero no deben sumar disponibilidad a nadie ni
 *  aparecer como opción para asignar horas nuevas. */
function cupofDisponible(f){ const iEst=ix('CUPOF','ESTADO'); const est=iEst>-1?String(f[iEst]||'').trim():''; return !est||est==='Vigente'; }
/* Excepción única admitida (error histórico del Ministerio, irresoluble — confirmado por el usuario):
 * esta CUPOF tiene 2 docentes designados (Ayala Nazario y Moreira Iván René), cada uno con su carga
 * completa por su lado — no es un excedido real aunque la suma de asignaciones de AMBOS duplique la
 * carga nominal de la CUPOF. Global para poder reutilizarla tanto en calcularValidacion() (no reportarla
 * como "excedida"/"doble designación") como en los reportes por docente (mostrar el uso PROPIO de cada
 * uno, no el total compartido — ver usadoPropioEnCupof()). */
const EXCEP_DOBLE=new Set([cupKey('0053200-PHC-EDUCFISI-5-I-MA-BOD-GH3')]);
/** Para una CUPOF de la excepción de arriba, cuánto usa REALMENTE este docente puntual (por DNI/nombre,
 *  vía asignacionesDelDocente), en vez del total compartido entre todos los que están designados en ella. */
function usadoPropioEnCupof(cupTexto, docente){
  const k=cupKey(cupTexto);
  const iAcu=ix('ASIGNACIONES','CUPOF (texto origen)'), iAh=ix('ASIGNACIONES','HS');
  return asignacionesDelDocente(docente).filter(({f})=>cupKey(f[iAcu])===k).reduce((a,{f})=>a+unNum(f[iAh]),0);
}
/* ============ HORAS REALMENTE A CARGO DE CADA DOCENTE (respeta suplencias por licencia) ============
 * Confirmado por el usuario (05/07/2026, ajustado el mismo día): el titular/interino es el "dueño" real
 * de la CUPOF y SIEMPRE computa sus horas asignadas, exista o no una suplente cubriéndolo — el cómputo
 * del plan de estudios se hace sobre las horas titulares/interinas. Una designación SUPLENTE solo computa
 * sus propias horas cuando es "huérfana" (sin ningún titular/interino detrás en esa misma CUPOF; son
 * válidas y ya se contaban bien). Cuando hay suplente cubriendo a un titular/interino, esa cobertura se
 * documenta aparte (columna OBS. de la planilla final — ver genPlanilla), no se le resta el crédito al
 * titular/interino ni se le duplica a la suplente. */
function cuposActivosDeDocente(docente){
  const iDnom=ix('DESIGNACIONES','DOCENTE'), iDcup=ix('DESIGNACIONES','CUPOF'), iDsit=ix('DESIGNACIONES','SIT. REVISTA');
  const desTodas=filas('DESIGNACIONES');
  const cuposConTitularInterino=new Set();
  desTodas.forEach(d=>{ const s=String(d[iDsit]||'').toUpperCase().trim(); if(s==='TITULAR'||s==='INTERINO') cuposConTitularInterino.add(cupKey(d[iDcup])); });
  const activos=new Set();
  desTodas.filter(d=>d[iDnom]===docente).forEach(d=>{
    const k=cupKey(d[iDcup]); if(!k)return;
    const situ=String(d[iDsit]||'').toUpperCase().trim();
    const activo=situ==='SUPLENTE'?!cuposConTitularInterino.has(k):true;
    if(activo)activos.add(k);
  });
  return activos;
}
/** Filas de ASIGNACIONES que hoy cuentan como de este docente (ver cuposActivosDeDocente): todas las de
 *  sus cupof "activas", salvo en la única cupof con doble designación por error del Ministerio
 *  (EXCEP_DOBLE), donde además se filtra por su propio nombre/DNI — ahí sí comparten literalmente el
 *  mismo código de cupof con otra persona y hay que separar el uso de cada una. */
function asignacionesActivasDeDocente(docente){
  const activos=cuposActivosDeDocente(docente);
  const iAcu=ix('ASIGNACIONES','CUPOF (texto origen)');
  const propias=asignacionesDelDocente(docente);
  const propiosIdx=new Set(propias.map(({i})=>i));
  return filas('ASIGNACIONES').map((f,i)=>({f,i})).filter(({f,i})=>{
    const k=cupKey(f[iAcu]); if(!activos.has(k))return false;
    if(EXCEP_DOBLE.has(k))return propiosIdx.has(i);
    return true;
  });
}
function cargasCupof(){ // key -> {carga, usado, docs:[docentes designados]}
  const m={};
  const iCa=ix('CUPOF','CARGA'), iCl=ix('CUPOF','CLASE');
  filas('CUPOF').forEach(f=>{if(f[iCl]!=='Horas')return;if(!cupofDisponible(f))return;const k=cupKey(f[0]);m[k]={carga:unNum(f[iCa]),usado:0,fila:f};});
  const iAh=ix('ASIGNACIONES','HS'), iAcu=ix('ASIGNACIONES','CUPOF (texto origen)');
  filas('ASIGNACIONES').forEach(a=>{const k=cupKey(a[iAcu]);if(m[k])m[k].usado+=unNum(a[iAh]);});
  return m;
}

/* ============ LOGIN / NAV ============ */
document.getElementById('apiUrl').value=API;
async function entrar(){
  API=document.getElementById('apiUrl').value.trim(); if(!API)return msg('Falta la URL de la API');
  localStorage.setItem('conc_api',API);
  try{const j=await apiGet({action:'login',usuario:document.getElementById('usuario').value,clave:document.getElementById('clave').value});
    if(!j.ok)return msg(j.error);
    TOKEN=j.token;ROL=j.rol;localStorage.setItem('conc_token',TOKEN);localStorage.setItem('conc_rol',ROL);localStorage.setItem('conc_nombre',j.nombre);
    iniciar(j.nombre);
  }catch(e){msg('No se pudo conectar: '+e.message);}
}
function salir(){TOKEN='';localStorage.removeItem('conc_token');location.reload();}
async function iniciar(nombre){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('nav').style.display='flex';
  document.getElementById('btnSalir').style.display='inline-block';
  document.getElementById('who').textContent=(nombre||localStorage.getItem('conc_nombre')||'')+' · '+(ROL==='admin'?'administración':'consulta');
  if(ROL==='admin')document.getElementById('tabAud').style.display='inline-block';
  msg('Cargando base…',9000);
  const j=await apiGet({action:'bd',token:TOKEN}); BD=j.bd; msg('Base cargada'); render();
}
if(TOKEN&&API)iniciar();
document.getElementById('nav').addEventListener('click',e=>{
  if(e.target.dataset.t===undefined)return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('act'));
  e.target.classList.add('act');
  document.querySelectorAll('main section').forEach(s=>s.style.display='none');
  document.getElementById('v-'+e.target.dataset.t).style.display='block';
  render(e.target.dataset.t);
});
function render(tab){tab=tab||document.querySelector('nav button.act').dataset.t;
  ({conciliador:rConciliador,datos:rDatos,validador:rValidador,reportes:rReportes,generar:rGenerar,auditoria:rAuditoria})[tab]();}

/* ============ CONCILIADOR (edición en línea) ============ */
let selPlan='CBS-672', selCurso='1°', selDiv='I', addEsp=null, addDoc='', editIdx=null, editDoc='';
let conTab='horas';
function asigsDe(plan,curso,div){
  const iP=ix('ASIGNACIONES','PLAN DESTINO'),iC=ix('ASIGNACIONES','CURSO'),iD=ix('ASIGNACIONES','DIV.');
  return filas('ASIGNACIONES').map((f,i)=>({f,i})).filter(({f})=>PLAN_MAP[f[iP]]===plan&&String(f[iC])===String(curso)&&(!div||String(f[iD]||'I')===div));
}
/** Dispatcher de la pestaña Conciliador: dos subpestañas — "Asignación de Horas" (edición en línea,
 *  caja vs asignaciones, la de siempre) y "Asignación para crear Tiempos" (propuesta de agrupar CUPOF
 *  sueltas de un mismo docente en un nuevo Tiempo PTP/PTC, más consulta de los Tiempos ya existentes). */
function rConciliador(){
  const v=document.getElementById('v-conciliador');
  v.innerHTML=`<div class="card" style="margin-bottom:10px;padding:0;border:0;background:none">

/* ============ ASIGNACIÓN PARA CREAR TIEMPOS (propuesta, no escribe en CUPOF/TIEMPOS) ============
 * Dos secciones: (1) Consulta de un Tiempo ya existente — qué CUPOF tiene agrupadas y si la suma
 * coincide con sus horas declaradas; (2) Propuesta de un Tiempo nuevo — elegís un docente, marcás
 * CUPOF sueltas suyas (de clase "Horas", sin SUFIJO TIEMPO todavía) y armás un grupo cuya suma debería
 * dar un valor válido (PTP 12/18/24/30, o PTC exactamente 36). Guardar NO toca CUPOF ni TIEMPOS: solo
 * registra la propuesta en la hoja PROPUESTAS_TIEMPO, para la planilla "PROPUESTA DE CREACIÓN DE
 * CARGOS" — la creación real del Tiempo la decide y aplica el usuario aparte si el Ministerio aprueba. */
let propTiempoSel='', propDoc='', propSel={};
const VALORES_TIEMPO_VALIDOS=[12,18,24,30,36];
function tipoDeHoras(hs){ if(hs===36)return 'PTC 36'; if([12,18,24,30].includes(hs))return 'PTP '+hs; return null; }
function rConciliadorTiempos(){
  const v=document.getElementById('conBody');
  const iSuf=ix('CUPOF','SUFIJO TIEMPO'), iCarga=ix('CUPOF','CARGA'), iClase=ix('CUPOF','CLASE');
  const cupHorasIdx={}; // sufijo -> [{cup,carga}]
  filas('CUPOF').forEach(f=>{ if(f[iClase]!=='Horas')return; const suf=f[iSuf]; if(!suf)return; (cupHorasIdx[suf]=cupHorasIdx[suf]||[]).push({cup:f[0],carga:unNum(f[iCarga])}); });
  const tiempos=filas('TIEMPOS');
  const iTsuf=ix('TIEMPOS','SUFIJO'),iTtipo=ix('TIEMPOS','TIPO'),iThs=ix('TIEMPOS','HS'),iTdoc=ix('TIEMPOS','DOCENTE'),iTsup=ix('TIEMPOS','SUPLENTE');
  if(!propTiempoSel)propTiempoSel=tiempos[0]?tiempos[0][iTsuf]:'';
  const tRow=tiempos.find(t=>String(t[iTsuf])===String(propTiempoSel));
  const grupo=cupHorasIdx[propTiempoSel]||[];
  const sumaGrupo=grupo.reduce((a,g)=>a+g.carga,0);
  const declarado=tRow?unNum(tRow[iThs]):0;

  const docs=filas('DOCENTES').map(f=>f[1]).sort();
  if(!propDoc)propDoc=docs[0]||'';
  const cupIdx={};filas('CUPOF').forEach(f=>cupIdx[cupKey(f[0])]=f);
  const sueltas=designacionesDelDocente(propDoc).map(f=>{
    const c=cupIdx[cupKey(f[2])];
    if(!c||c[iClase]!=='Horas'||c[iSuf])return null; // solo horas sueltas, sin Tiempo asignado todavía
    return {key:cupKey(f[2]),cup:c[0],carga:unNum(c[iCarga])};
  }).filter(Boolean);
  const vistos=new Set(); const sueltasUnicas=sueltas.filter(x=>vistos.has(x.key)?false:(vistos.add(x.key),true));
  const marcadas=sueltasUnicas.filter(x=>propSel[x.key]);
  const sumaProp=marcadas.reduce((a,x)=>a+x.carga,0);
  const tipoSug=tipoDeHoras(sumaProp);
  const docRow=filas('DOCENTES').find(f=>f[1]===propDoc);
  const dni=docRow?docRow[0]:'';

  const propuestas=filas('PROPUESTAS_TIEMPO')||[];

  v.innerHTML=`<div class="card"><h3>Consultar un Tiempo existente</h3>
   <p class="mini">Elegí un sufijo de Tiempo para ver qué CUPOF de horas tiene agrupadas hoy y si la suma coincide con lo declarado.</p>
   <div class="fila"><div><label>Tiempo (sufijo)</label><select id="tSel">${tiempos.map(t=>`<option value="${esc(t[iTsuf])}" ${String(t[iTsuf])===String(propTiempoSel)?'selected':''}>${esc(t[iTsuf])} — ${esc(t[iTtipo])} ${esc(t[iThs])}hs — ${esc(t[iTdoc]||t[iTsup]||'')}</option>`).join('')}</select></div></div>
   ${tRow?`<p style="margin-top:8px"><b>Declarado:</b> ${esc(tRow[iTtipo])} ${declarado}hs · <b>Docente:</b> ${esc(tRow[iTdoc]||'')}${tRow[iTsup]?` · <b>Suplente:</b> ${esc(tRow[iTsup])}`:''}
    · <b>Suma de sus CUPOF:</b> <span${sumaGrupo!==declarado?' style="color:#c00;font-weight:bold"':''}>${sumaGrupo}hs${sumaGrupo!==declarado?' ⚠ no coincide':''}</span></p>
    <div class="tabla-wrap"><table><tr><th>CUPOF</th><th>CARGA</th></tr>${grupo.map(g=>`<tr><td class="cupofcell">${esc(g.cup)}</td><td>${g.carga}</td></tr>`).join('')||'<tr><td colspan="2" class="mini">Ninguna CUPOF con este sufijo</td></tr>'}</table></div>`:'<p class="mini">No hay Tiempos cargados.</p>'}
  </div>
  <div class="card"><h3>Proponer un Tiempo nuevo</h3>
   <p class="mini">Elegí un docente y marcá sus CUPOF sueltas (de horas, sin Tiempo asignado todavía) que querés agrupar en un Tiempo nuevo. Solo se guarda como propuesta — no modifica CUPOF ni TIEMPOS.</p>
   <div class="fila"><div><label>Docente</label><select id="pDoc">${docs.map(d=>`<option ${d===propDoc?'selected':''}>${esc(d)}</option>`).join('')}</select></div></div>
   ${sueltasUnicas.length?`<div class="tabla-wrap" style="margin-top:8px"><table><tr><th></th><th>CUPOF</th><th>CARGA</th></tr>
    ${sueltasUnicas.map(x=>`<tr><td><input type="checkbox" ${propSel[x.key]?'checked':''} onchange="propSel['${x.key}']=this.checked;rConciliadorTiempos()"></td><td class="cupofcell">${esc(x.cup)}</td><td>${x.carga}</td></tr>`).join('')}</table></div>`
    :'<p class="mini">Este docente no tiene CUPOF de horas sueltas (sin Tiempo) disponibles para agrupar.</p>'}
   <p style="margin-top:8px"><b>Suma marcada:</b> ${sumaProp}hs — ${tipoSug?`<span class="pill ok">${tipoSug} ✔ válido</span>`:marcadas.length?`<span class="pill exceso">⚠ no coincide con un valor de Tiempo (12/18/24/30 PTP, 36 PTC)</span>`:''}</p>
   <div><label>Observación (opcional)</label><input id="pObs" style="width:100%"></div>
   ${ROL==='admin'?`<div class="fila" style="margin-top:8px"><button class="b ${marcadas.length?'':'sec'}" ${marcadas.length?'':'disabled'} onclick="accion(this,guardarPropuestaTiempo)">💾 Guardar propuesta</button></div>`:''}
  </div>
  <div class="card"><h3>Propuestas guardadas (${propuestas.length})</h3>
   ${propuestas.length?`<div class="tabla-wrap"><table><tr><th>FECHA</th><th>DOCENTE</th><th>TIPO</th><th>HORAS</th><th>CUPOF INCLUIDAS</th><th>OBS</th>${ROL==='admin'?'<th></th>':''}</tr>
    ${propuestas.map((f,i)=>`<tr><td>${esc(f[0])}</td><td>${esc(f[2])}</td><td>${esc(f[3])}</td><td>${esc(f[4])}</td><td class="mini">${esc(f[5])}</td><td class="mini">${esc(f[7])}</td>${ROL==='admin'?`<td><a href="#" onclick="accion(this,()=>borrarPropuestaTiempo(${i})); return false">🗑</a></td>`:''}</tr>`).join('')}</table></div>`:'<p class="mini">Ninguna todavía.</p>'}
  </div>`;
  document.getElementById('tSel').onchange=e=>{propTiempoSel=e.target.value;rConciliadorTiempos();};
  document.getElementById('pDoc').onchange=e=>{propDoc=e.target.value;propSel={};rConciliadorTiempos();};
}
async function guardarPropuestaTiempo(){
  const iSuf=ix('CUPOF','SUFIJO TIEMPO'), iCarga=ix('CUPOF','CARGA'), iClase=ix('CUPOF','CLASE');
  const cupIdx={};filas('CUPOF').forEach(f=>cupIdx[cupKey(f[0])]=f);
  const sueltas=designacionesDelDocente(propDoc).map(f=>{
    const c=cupIdx[cupKey(f[2])];
    if(!c||c[iClase]!=='Horas'||c[iSuf])return null;
    return {key:cupKey(f[2]),cup:c[0],carga:unNum(c[iCarga])};
  }).filter(Boolean);
  const vistos=new Set(); const sueltasUnicas=sueltas.filter(x=>vistos.has(x.key)?false:(vistos.add(x.key),true));
  const marcadas=sueltasUnicas.filter(x=>propSel[x.key]);
  if(!marcadas.length)return msg('Marcá al menos una CUPOF para proponer un Tiempo.');
  const suma=marcadas.reduce((a,x)=>a+x.carga,0);
  const tipo=tipoDeHoras(suma);
  if(!tipo && !confirm(`La suma marcada (${suma}hs) no coincide con un valor de Tiempo válido (12/18/24/30 PTP, 36 PTC). ¿Guardar la propuesta igual, para revisar después?`))return;
  const docRow=filas('DOCENTES').find(f=>f[1]===propDoc);
  const fecha=new Date().toLocaleDateString('es-AR');
  const vals=['FECHA','DNI','DOCENTE','TIPO PROPUESTO','HORAS TOTAL','CUPOF INCLUIDAS','ESTADO','OBS','USUARIO'].map(col=>({
    'FECHA':fecha,'DNI':docRow?docRow[0]:'','DOCENTE':propDoc,'TIPO PROPUESTO':tipo||'(sin coincidencia)','HORAS TOTAL':suma,
    'CUPOF INCLUIDAS':marcadas.map(x=>x.cup).join(' / '),'ESTADO':'propuesta','OBS':document.getElementById('pObs').value||'',
    'USUARIO':localStorage.getItem('conc_nombre')||''}[col]));
  try{
    await apiPost({action:'crear',entidad:'PROPUESTAS_TIEMPO',valores:vals});
    BD['PROPUESTAS_TIEMPO'].filas.push(vals.map(String));
    propSel={};
    msg('Propuesta guardada');rConciliadorTiempos();
  }catch(e){msg('Error: '+e.message);}
}
async function borrarPropuestaTiempo(i){
  if(!confirm('¿Quitar esta propuesta de Tiempo?'))return;
  try{await apiPost({action:'borrar',entidad:'PROPUESTAS_TIEMPO',fila:i+1});BD['PROPUESTAS_TIEMPO'].filas.splice(i,1);msg('Quitada');rConciliadorTiempos();}
  catch(e){msg('Error: '+e.message);}
}

/** Designaciones de un docente por DNI (más confiable) con respaldo por nombre difuso (normE), en vez de
 *  comparación exacta de texto: el mismo docente puede estar escrito distinto en DOCENTES vs DESIGNACIONES
 *  (con/sin coma, con/sin acentos), y eso hacía que sus CUPOF con saldo no aparecieran para asignar. */
function designacionesDelDocente(docente){
  const docRow=filas('DOCENTES').find(f=>f[1]===docente);
  const dni=docRow?String(docRow[0]).replace(/\D/g,''):'';
  const ap=normE(docente).slice(0,9);
  return filas('DESIGNACIONES').filter(f=>{
    if(dni&&String(f[0]).replace(/\D/g,'')===dni)return true;
    const fn=normE(f[1]);
    return fn.includes(ap.slice(0,8))||ap.includes(fn.slice(0,8));
  });
}
/** Asignaciones de un docente por DNI (si ASIGNACIONES ya tiene esa columna y la fila la tiene completa)
 *  con respaldo por nombre difuso para las filas viejas que todavía no la tienen. Devuelve pares {f,i}
 *  (índice dentro de filas('ASIGNACIONES')) para poder editar/auditar la fila si hace falta. Centraliza
 *  acá el criterio de "qué asignaciones son de este docente" para no repetirlo distinto en cada reporte. */
function asignacionesDelDocente(docente){
  const docRow=filas('DOCENTES').find(f=>f[1]===docente);
  const dni=docRow?String(docRow[0]).replace(/\D/g,''):'';
  const iAdo=ix('ASIGNACIONES','DOCENTE'), iAdni=ix('ASIGNACIONES','DNI');
  const ap=normE(docente).slice(0,9);
  return filas('ASIGNACIONES').map((f,i)=>({f,i})).filter(({f})=>{
    if(dni&&iAdni>-1&&f[iAdni]&&String(f[iAdni]).replace(/\D/g,'')===dni)return true;
    if(!f[iAdo])return false;
    const fn=normE(f[iAdo]);
    return fn.includes(ap.slice(0,8))||ap.includes(fn.slice(0,8));
  });
}
function cupofSelect(docente,cargas,actual){
  const kAct=actual?cupKey(actual):null;
  const opts=designacionesDelDocente(docente).map(f=>{
    const k=cupKey(f[2]); const c=cargas[k];
    if(!c||c.carga<=0)return null;
    const libre=Math.round((c.carga-c.usado)*10)/10;
    if(libre<=0&&k!==kAct)return null;
    return `<option value="${esc(f[2])}" ${k===kAct?'selected':''}>${esc(f[2])} — libre ${libre} de ${c.carga} (${esc(f[3])})</option>`;
  }).filter(Boolean).join('');
  return opts?`<select id="${actual?'edCup':'addCup'}" class="cupofcell" style="max-width:420px">${opts}</select>`:'<span class="mini">sin CUPOF disponibles</span>';
}
/** Recalcula y guarda el código de "N° PARCIAL" (CLAVE-P1, CLAVE-P2, ...) de todas las filas de
 *  ASIGNACIONES que comparten una misma clave de CUPOF, en el orden en que aparecen. Si solo hay una
 *  fila para esa clave (no es parcial) deja la columna vacía. No hace nada si la columna todavía no
 *  existe en la base (falta correr agregarColumnaParcial() una vez desde Apps Script). */
async function sincronizarParciales(clave){
  const iN=ix('ASIGNACIONES','N° PARCIAL'); if(iN===-1||!clave)return;
  const iCu=ix('ASIGNACIONES','CUPOF (texto origen)');
  const grupo=filas('ASIGNACIONES').map((f,i)=>({f,i})).filter(({f})=>cupKey(f[iCu])===clave);
  for(let idx=0;idx<grupo.length;idx++){
    const {f,i}=grupo[idx];
    const codigo=grupo.length<2?'':clave+'-P'+(idx+1);
    if((f[iN]||'')!==codigo){
      const nuevos=f.slice(); nuevos[iN]=codigo;

async function guardarEdicion(i,espN){

  const cargas=cargasCupof();
  const mismaCupof=cupKey(cup)===cupKey(f[iAcu]);
  const actualHs=mismaCupof?unNum(f[iAh]):0;
  const propio=actualHs;

    if(hs>falta){hs=falta;msg('Ajustado a '+hs+' hs (caja)');}

  }
  const nuevos=f.slice(); nuevos[iAcu]=cup; nuevos[iAdo]=doc; nuevos[iAh]=String(hs); nuevos[iAe]=c?c.nom:f[iAe];

    await sincronizarParciales(claveNueva); if(claveVieja&&claveVieja!==claveNueva)await sincronizarParciales(claveVieja);
    msg('Actualizado');rConciliador();}
  catch(e){msg('Error: '+e.message);}

async function repararBase(){
  if(ROL!=='admin')return msg('Solo administración');
  const iAcu=ix('ASIGNACIONES','CUPOF (texto origen)'),iAh=ix('ASIGNACIONES','HS'),iAdo=ix('ASIGNACIONES','DOCENTE'),
        iAo=ix('ASIGNACIONES','OBS.'),iAe=ix('ASIGNACIONES','ESPACIO DESTINO'),iAp=ix('ASIGNACIONES','PLAN DESTINO'),iAc=ix('ASIGNACIONES','CURSO');
  const tareas=BD['ASIGNACIONES'].filas.map((f,i)=>{
    const partes=String(f[iAcu]).split(/[-\s\/]+(?=0{0,4}\d?53200)/).map(x=>x.replace(/[\s\/]+$/,'').trim()).filter(x=>/53200/.test(x));
    const plan=PLAN_MAP[f[iAp]]||f[iAp];
    const m=matchEspacio(f[iAe],cajaDe(plan,f[iAc],true)||[]);
    return {i,f,partes,canon:m?m.nom:null};
  });
  const nDiv=tareas.filter(t=>t.partes.length>1).length;
  const nVac=tareas.filter(t=>t.partes.length===0&&t.f[iAdo]).length;
  const nNom=tareas.filter(t=>t.canon&&t.canon!==t.f[iAe]).length;
  if(!confirm(`Reparación de la base:\n· ${nDiv} filas con varias CUPOF se dividirán\n· ${nVac} vacantes con docente arrastrado se corregirán\n· ${nNom} nombres de espacio se normalizarán\nPuede tardar unos minutos. ¿Continuar?`))return;
  let hechos=0;
  for(const t of tareas){
    try{
      const f=t.f.slice(); let cambio=false;
      if(t.canon&&t.canon!==f[iAe]){f[iAe]=t.canon;cambio=true;}
      if(t.partes.length===0&&f[iAdo]){f[iAdo]='';f[iAo]=((f[iAo]||'')+' VACANTE').trim();cambio=true;}
      if(t.partes.length>1){
        const hsTok=String(t.f[iAh]).match(/\d+(?:[.,]\d+)?/g)||[]; let tk=0;
        const hsDe=p=>{const mp=p.match(/\(\s*(\d+[.,]?\d*)\s*h/i);return mp?mp[1]:(hsTok[tk++]??'');};
        f[iAcu]=compactarCupof(t.partes[0]); f[iAh]=hsDe(t.partes[0]);
        await apiPost({action:'editar',entidad:'ASIGNACIONES',fila:t.i+1,valores:f});
        BD['ASIGNACIONES'].filas[t.i]=f.map(x=>String(x??''));
        for(let p=1;p<t.partes.length;p++){
          const nf=t.f.slice(); nf[iAcu]=compactarCupof(t.partes[p]); nf[iAh]=hsDe(t.partes[p]);
          nf[iAo]=((t.f[iAo]||'')+' (división)').trim(); if(t.canon)nf[iAe]=t.canon;
          await apiPost({action:'crear',entidad:'ASIGNACIONES',valores:nf});
          BD['ASIGNACIONES'].filas.push(nf.map(x=>String(x??'')));
        }
      } else {
        // aunque no haya división ni rename, aprovechamos para compactar espacios internos de la CUPOF
        const compacta=compactarCupof(f[iAcu]);
        if(compacta!==f[iAcu]){ f[iAcu]=compacta; cambio=true; }
        if(cambio){
          await apiPost({action:'editar',entidad:'ASIGNACIONES',fila:t.i+1,valores:f});
          BD['ASIGNACIONES'].filas[t.i]=f.map(x=>String(x??''));
        }
      }
    }catch(e){msg('Error en fila '+(t.i+2)+': '+e.message,6000);}
    hechos++; if(hechos%15===0)msg(`Reparando… ${hechos}/${tareas.length}`,3000);
  }
  msg('Sincronizando códigos de parcial…',6000);
  try{await sincronizarTodosLosParciales();}catch(e){}
  msg('Reparación completa. Recargando…',5000);
  const j=await apiGet({action:'bd',token:TOKEN}); BD=j.bd; render();
}

let ordSin={col:0,asc:true};
/** Todo el cálculo de validación (sin renderizar HTML), reutilizado por rValidador() y por genPlanilla()
 *  para avisar de observaciones "graves" pendientes antes de descargar la planilla oficial. */
function calcularValidacion(){
  const problemas=[];
  const add=(nivel,txt)=>problemas.push({nivel,txt});
  const dnis=new Set(filas('DOCENTES').map(f=>String(f[0])));
  const cupIdx={};filas('CUPOF').forEach(f=>cupIdx[cupKey(f[0])]=f);
  filas('DESIGNACIONES').forEach((f,i)=>{
    if(!dnis.has(String(f[0])))add('grave',`DESIGNACIONES fila ${i+2}: DNI ${f[0]} no existe en DOCENTES`);
    if(!cupIdx[cupKey(f[2])])add('grave',`DESIGNACIONES fila ${i+2}: CUPOF ${f[2]} no existe`);
  });
  // Excepción única admitida (error histórico del Ministerio, irresoluble — confirmado por el usuario): no reportar
  // (EXCEP_DOBLE ahora es global, ver definición junto a cupofDisponible/cargasCupof, reutilizada también en Reportes)
  const combo={};filas('DESIGNACIONES').forEach(f=>{const k=cupKey(f[2])+'|'+f[3];(combo[k]=combo[k]||[]).push(f[1]);});
  Object.entries(combo).forEach(([k,v2])=>{if(v2.length>1){const[c,s]=k.split('|');if(EXCEP_DOBLE.has(c))return;add('grave',`CUPOF ${c}: ${v2.length} docentes con la misma situación (${s}): ${v2.join(', ')}`);}});
  filas('TIEMPOS').forEach(t=>{
    const suf=String(t[0]),esperado=unNum(t[2]);
    const suma=filas('CUPOF').filter(f=>String(f[ix('CUPOF','SUFIJO TIEMPO')])===suf).reduce((a,f)=>a+unNum(f[ix('CUPOF','CARGA')]),0);
    if(suma!==esperado)add('leve',`Tiempo ${suf} (${t[5]}): CUPOF suman ${suma} hs y el cargo es de ${esperado}`);
  });
  ['CBS-672','BCS','BCN','BEA','BEA-EPJA'].forEach(plan=>{
    const cursosP=[...new Set(filas('ESPACIOS').filter(f=>f[0]===plan).map(f=>String(f[1])))];
    cursosP.forEach(curso=>{
      const divs=(DIVS[plan]&&DIVS[plan][curso])||['I'];
      divs.forEach(div=>{
        const caja=cajaDe(plan,curso);const asigs=asigsDe(plan,curso,div);
        const iAe=ix('ASIGNACIONES','ESPACIO DESTINO'),iAh=ix('ASIGNACIONES','HS'),iAcu2=ix('ASIGNACIONES','CUPOF (texto origen)');
        const suma={};caja.forEach(c=>suma[c.n]=0);
        asigs.forEach(({f})=>{if(!cupKey(f[iAcu2]))return;const m=matchEspacio(f[iAe],caja);if(m)suma[m.n]+=unNum(f[iAh]);});
        caja.forEach(c=>{ if(suma[c.n]<c.hs)add('leve',`${plan} ${curso} ${div}: "${c.nom}" ${suma[c.n]}/${c.hs} hs`);
          if(suma[c.n]>c.hs)add('grave',`${plan} ${curso} ${div}: "${c.nom}" EXCEDE (${suma[c.n]}/${c.hs})`);});
      });
    });
  });
  // CUPOF de horas sin asignar (con saldo) — plan|espacio|cupof|docente|carga, ordenable
  const cargas=cargasCupof();
  const desg=filas('DESIGNACIONES');
  let sinUsar=Object.entries(cargas).filter(([k,c])=>c.carga>0&&c.usado<c.carga).map(([k,c])=>{
    const f=c.fila;
    const dsg=desg.filter(d=>cupKey(d[2])===k);
    const doc=(dsg.find(d=>d[3]!=='SUPLENTE')||dsg[0]||[]);
    return [f[ix('CUPOF','PLAN')],f[ix('CUPOF','ESPACIO')],f[0],doc[1]||'(sin designación)',`${c.carga-c.usado} de ${c.carga}`];
  });
  sinUsar.sort((a,b)=>{const x=String(a[ordSin.col]),y=String(b[ordSin.col]);return (x<y?-1:x>y?1:0)*(ordSin.asc?1:-1);});
  const HD=['PLAN','ESPACIO','CUPOF','DOCENTE','CARGA DISPONIBLE'];
  // ====== Auditoría integral asignación ↔ CUPOF (verificación integral pedida por el usuario) ======
  const cupIdxHoras={};filas('CUPOF').forEach(f=>{if(f[ix('CUPOF','CLASE')]==='Horas')cupIdxHoras[cupKey(f[0])]=f;});
  const iAcuAud=ix('ASIGNACIONES','CUPOF (texto origen)'),iAhAud=ix('ASIGNACIONES','HS'),iAdoAud=ix('ASIGNACIONES','DOCENTE'),
        iApAud=ix('ASIGNACIONES','PLAN DESTINO'),iAcAud=ix('ASIGNACIONES','CURSO'),iAeAud=ix('ASIGNACIONES','ESPACIO DESTINO');
  const huerfanas=[];
  filas('ASIGNACIONES').forEach((f,i)=>{
    const txt=f[iAcuAud]; if(!txt)return; // sin CUPOF de origen = vacante explícita, no es huérfana
    const k=cupKey(txt);
    if(!k||!cupIdxHoras[k])huerfanas.push({i,f});
  });
  // Misma excepción admitida de arriba (histórico del Ministerio, irresoluble, confirmado por el usuario):
  // esta CUPOF puntual tiene 2 docentes designados por el mismo error, cada uno con su carga completa —
  // no se reporta como "excedida" aunque la suma de asignaciones duplique su carga nominal.
  const excedidas=Object.entries(cargas).filter(([k,c])=>c.usado>c.carga&&!EXCEP_DOBLE.has(k)).map(([k,c])=>{
    const f=c.fila; return {plan:f[ix('CUPOF','PLAN')],esp:f[ix('CUPOF','ESPACIO')],cup:f[0],usado:c.usado,carga:c.carga};
  });
  excedidas.forEach(e=>add('grave',`CUPOF ${e.cup} (${e.esp}, ${e.plan}): tiene asignadas ${e.usado} hs sobre una carga de ${e.carga} hs — hay que reducir alguna asignación`));
  // ====== CARGA vs. lo que indica el propio texto de la CUPOF (GH# o número final) ======
  const cargaMal=[];
  filas('CUPOF').forEach((f,i)=>{
    if(f[ix('CUPOF','CLASE')]!=='Horas')return;
    const parsed=cargaDesdeCupof(f[0]); if(parsed===null)return;
    const actual=unNum(f[ix('CUPOF','CARGA')]);
    if(parsed!==actual)cargaMal.push({i,f,parsed,actual});
  });
  cargaMal.forEach(x=>add('grave',`CUPOF ${x.f[0]}: columna CARGA dice ${x.actual} pero el propio texto indica ${x.parsed} hs`));
  // cargaVacia: la CARGA está en blanco/0 (sin dato, no hay nada que "pisar") -> se puede revisar y confirmar en lote.
  // cargaConflicto: la CARGA tiene un valor distinto de 0 que no coincide con el texto -> requiere criterio, se corrige de a una.
  const cargaVacia=cargaMal.filter(x=>x.actual===0);
  const cargaConflicto=cargaMal.filter(x=>x.actual!==0);
  // ====== Posibles CUPOF duplicadas por variante de ortografía del espacio (misma estructura numérica) ======
  const gruposEstructura={};
  filas('CUPOF').forEach(f=>{
    if(f[ix('CUPOF','CLASE')]!=='Horas')return;
    const e=estructuraCupof(f[0]); if(!e)return;
    (gruposEstructura[e.estructural]=gruposEstructura[e.estructural]||[]).push({espacio:e.espacio,cup:f[0]});
  });
  const variantesCupof=Object.entries(gruposEstructura).map(([key,items])=>({key,items}))
    .filter(g=>new Set(g.items.map(x=>x.espacio)).size>1);
  // ====== DNI sin completar en ASIGNACIONES (columna nueva, para dejar de identificar al docente por texto) ======
  // Solo se calcula si la columna DNI ya existe (agregarColumnaDniAsignaciones() en Apps Script). Para cada fila
  // con docente pero sin DNI, se sugieren los candidatos de DOCENTES cuyo nombre coincide de forma difusa —
  // normalmente uno solo; si hay más de uno, se deja para elegir a mano en vez de adivinar.
  const iAdniV=ix('ASIGNACIONES','DNI');
  const dniFaltante=[];
  if(iAdniV>-1){
    filas('ASIGNACIONES').forEach((f,i)=>{
      if(!f[iAdoAud]||f[iAdniV])return; // vacante (sin docente) o ya completo
      const ap=normE(f[iAdoAud]);
      const candidatos=filas('DOCENTES').filter(d=>{const dn=normE(d[1]);return dn.includes(ap.slice(0,8))||ap.includes(dn.slice(0,8));});
      dniFaltante.push({i,f,candidatos});
    });
  }
  return {problemas,sinUsar,excedidas,huerfanas,cargaMal,cargaVacia,cargaConflicto,variantesCupof,dniFaltante,
    iAcuAud,iAhAud,iAdoAud,iApAud,iAcAud,iAeAud,HD};
}

/** Muestra en un modal las filas de ASIGNACIONES que efectivamente cuentan como "usado" para esta CUPOF,
 *  buscadas por cupKey (no por texto literal). Sirve para diagnosticar casos donde el saldo mostrado no
 *  cierra con lo que se encuentra buscando el texto tal cual en Datos: la causa suele ser una diferencia
 *  de tipeo (espacio, guion, mayúscula) entre el texto guardado y la CUPOF canónica — mismo cupKey, texto distinto. */
function verAsignacionesDeCupof(cupofTxt){
  const k=cupKey(cupofTxt);
  const iAcu=ix('ASIGNACIONES','CUPOF (texto origen)'),iAp=ix('ASIGNACIONES','PLAN DESTINO'),iAc=ix('ASIGNACIONES','CURSO'),
        iAd=ix('ASIGNACIONES','DIV.'),iAe=ix('ASIGNACIONES','ESPACIO DESTINO'),iAh=ix('ASIGNACIONES','HS'),iAdo=ix('ASIGNACIONES','DOCENTE');
  const encontradas=filas('ASIGNACIONES').filter(f=>cupKey(f[iAcu])===k);
  const cc=cargasCupof()[k];
  const carga=cc?cc.carga:null, usado=cc?cc.usado:encontradas.reduce((a,f)=>a+hsNum(f[iAh]),0);
  const disp=carga!=null?Math.round((carga-usado)*10)/10:null;
  const excedida=carga!=null&&usado>carga;
  const d=document.getElementById('dlg');
  d.innerHTML=`<h2>Asignaciones que cuentan para esta CUPOF</h2>
   <p class="mini">Buscadas por clave normalizada (cupKey), igual que hace el Validador — no por coincidencia literal de texto.</p>
   <p class="cupofcell">${esc(cupofTxt)}</p>
   ${carga!=null?`<p><b>CARGA:</b> ${carga} &nbsp; <b>USADO:</b> ${usado} &nbsp; <b>DISPONIBLE:</b> <span${excedida?' style="color:#c00;font-weight:bold"':''}>${disp}${excedida?' ⚠ EXCEDIDA':''}</span></p>`:'<p class="mini">Esta CUPOF no figura en la hoja CUPOF (o no es de clase "Horas") — no tiene carga nominal contra la cual comparar.</p>'}
   ${encontradas.length?`<div class="tabla-wrap"><table><tr><th>PLAN</th><th>CURSO</th><th>DIV.</th><th>ESPACIO</th><th>DOCENTE</th><th>HS</th><th>TEXTO ORIGEN (tal cual guardado)</th></tr>
    ${encontradas.map(f=>`<tr><td>${esc(f[iAp])}</td><td>${esc(f[iAc])}</td><td>${esc(f[iAd])}</td><td>${esc(f[iAe])}</td><td>${esc(f[iAdo])}</td><td>${esc(f[iAh])}</td><td class="cupofcell">${esc(f[iAcu])}</td></tr>`).join('')}</table></div>`
    :'<p class="mini">Ninguna asignación cuenta contra esta CUPOF todavía — el saldo disponible debería ser igual a la carga total.</p>'}
   <div class="fila" style="margin-top:10px"><button class="b sec" onclick="dlg.close()">Cerrar</button></div>`;
  d.showModal();
}
/** Aplica en un solo lote las CUPOF cuya CARGA está en blanco (0), usando el valor sugerido que
 *  se ve (y se puede editar) en la tabla del Validador. Nunca toca una CUPOF cuya CARGA actual
 *  sea distinta de 0 (esas van por la tabla de "conflicto", de a una). */
async function confirmarCargasLote(){
  const {cargaVacia}=calcularValidacion();
  if(!cargaVacia.length)return msg('No hay cargas en blanco para confirmar.');
  const iCarga=ix('CUPOF','CARGA');
  const pendientes=cargaVacia.map(x=>{
    const el=document.getElementById('cv-'+x.i);
    const valor=el?Number(String(el.value).replace(',','.')):x.parsed;
    return {i:x.i, f:x.f, valor};
  }).filter(p=>p.valor>0 && !isNaN(p.valor));
  if(!pendientes.length)return msg('No hay valores válidos para aplicar.');
  if(!confirm(`Vas a completar la CARGA de ${pendientes.length} CUPOF con los valores mostrados (editados o sugeridos). ¿Confirmar?`))return;
  let ok=0, fallidas=[];
  for(const p of pendientes){
    // re-chequeo de seguridad: si la fila ya no está en 0 (otro usuario la corrigió), no la piso.
    const actualEnBD=unNum(BD['CUPOF'].filas[p.i][iCarga]);
    if(actualEnBD!==0){ fallidas.push(p.f[0]+' (ya no está en 0)'); continue; }
    const nuevos=p.f.slice(); nuevos[iCarga]=p.valor;
    try{ await apiPost({action:'editar',entidad:'CUPOF',fila:p.i+1,valores:nuevos}); BD['CUPOF'].filas[p.i]=nuevos; ok++; }
    catch(e){ fallidas.push(p.f[0]+' ('+e.message+')'); }
  }
  msg(`Cargas confirmadas: ${ok}${fallidas.length?` · ${fallidas.length} no se pudieron aplicar`:''}`, 6000);
  if(fallidas.length) console.warn('No se pudieron aplicar:', fallidas);
  render();
}

/** Aplica en un solo lote el DNI de las filas de ASIGNACIONES que todavía no lo tienen, usando el valor
 *  elegido/tipeado en la tabla del Validador (candidato único, elegido de la lista, o tipeado a mano).
 *  Filas dejadas en blanco (sin candidato claro y sin completar a mano) se saltan sin error. */
async function confirmarDniLote(){
  const {dniFaltante}=calcularValidacion();
  if(!dniFaltante.length)return msg('No hay DNI pendientes de completar.');
  const iAdni=ix('ASIGNACIONES','DNI'), iAdo=ix('ASIGNACIONES','DOCENTE');
  if(iAdni===-1)return msg('Falta la columna DNI en ASIGNACIONES: correr agregarColumnaDniAsignaciones() una vez desde Apps Script.',6000);
  const pendientes=dniFaltante.map(x=>{
    const el=document.getElementById('dv-'+x.i);
    const valor=el?String(el.value).trim():'';
    return {i:x.i, f:x.f, valor};
  }).filter(p=>p.valor);
  if(!pendientes.length)return msg('No completaste ningún DNI para aplicar.');
  if(!confirm(`Vas a completar el DNI de ${pendientes.length} asignaciones con los valores mostrados. ¿Confirmar?`))return;
  let ok=0, fallidas=[];
  for(const p of pendientes){
    const actualEnBD=BD['ASIGNACIONES'].filas[p.i][iAdni];
    if(actualEnBD){ fallidas.push(p.f[iAdo]+' (ya no está vacío)'); continue; } // por si otro usuario lo completó mientras tanto
    const nuevos=p.f.slice(); nuevos[iAdni]=p.valor;
    try{ await apiPost({action:'editar',entidad:'ASIGNACIONES',fila:p.i+1,valores:nuevos}); BD['ASIGNACIONES'].filas[p.i]=nuevos; ok++; }
    catch(e){ fallidas.push((p.f[iAdo]||'')+' ('+e.message+')'); }
  }
  msg(`DNI confirmados: ${ok}${fallidas.length?` · ${fallidas.length} no se pudieron aplicar`:''}`, 6000);
  if(fallidas.length) console.warn('No se pudieron aplicar:', fallidas);
  render();
}

/** Resumen por docente: horas declaradas por situación (Titular/Interino/Suplente, según DESIGNACIONES
 *  y la CARGA real de cada CUPOF), total declarado, horas ya asignadas en el plan nuevo, disponible
 *  (declarado - asignado), y el tiempo PTP/PTC que declara (si alguna de sus CUPOF pertenece a un tiempo). */
function balanceDocentes(){
  const cupIdxHoras={}; filas('CUPOF').forEach(f=>{ if(f[ix('CUPOF','CLASE')]==='Horas' && cupofDisponible(f)) cupIdxHoras[cupKey(f[0])]=f; });
  const iAdo=ix('ASIGNACIONES','DOCENTE'), iAh=ix('ASIGNACIONES','HS');
  const iSuf=ix('CUPOF','SUFIJO TIEMPO'), iCarga=ix('CUPOF','CARGA');
  const iTt=ix('TIEMPOS','TIPO'), iTh=ix('TIEMPOS','HS');
  const tiemposIdx={}; filas('TIEMPOS').forEach(t=>tiemposIdx[String(t[0])]=t);
  const r1=n=>Math.round(n*10)/10;
  const m={};
  filas('DESIGNACIONES').forEach(d=>{
    const dni=String(d[0]||'').trim(), nombre=d[1]||'', situ=String(d[3]||'').toUpperCase().trim();
    const cf=cupIdxHoras[cupKey(d[2])];
    const carga=cf?unNum(cf[iCarga]):0;
    const key=dni||nombre; if(!key)return;
    if(!m[key])m[key]={dni,nombre,titular:0,interino:0,suplente:0,otro:0,sufijos:new Set()};
    if(!m[key].nombre)m[key].nombre=nombre;
    if(situ==='TITULAR')m[key].titular+=carga;
    else if(situ==='INTERINO')m[key].interino+=carga;
    else if(situ==='SUPLENTE')m[key].suplente+=carga;
    else m[key].otro+=carga;
    if(cf&&cf[iSuf])m[key].sufijos.add(String(cf[iSuf]));
  });
  return Object.values(m).filter(r=>r.nombre).map(r=>{
    const declarado=r1(r.titular+r.interino+r.suplente+r.otro);
    const asignado=r1(asignacionesActivasDeDocente(r.nombre).reduce((a,{f})=>a+unNum(f[iAh]),0));
    const tsufs=[...r.sufijos].map(s=>tiemposIdx[s]).filter(Boolean);
    const tiempo=tsufs.length?tsufs.map(t=>`${t[iTt]||''} ${t[iTh]||''}hs`).join(' / '):'';
    return {nombre:r.nombre,dni:r.dni,titular:r1(r.titular),interino:r1(r.interino),suplente:r1(r.suplente),
      declarado,asignado,disponible:r1(declarado-asignado),tiempo};
  });
}

/* Constantes legales fijas del modelo (Res. de la reforma, marco legal, localidad, firma). Se repiten
 * igual en toda acta — si en algún momento cambian, se actualizan acá una sola vez. */

/** Busca la fila de TIEMPOS de este docente (como titular/interino, o como suplente si no aparece como titular). */
function tiempoDeDocente(docente){
  const iD=ix('TIEMPOS','DOCENTE'),iS=ix('TIEMPOS','SUPLENTE');
  let t=filas('TIEMPOS').find(f=>f[iD]&&normE(f[iD])===normE(docente)), esSuplente=false;
  if(!t){t=filas('TIEMPOS').find(f=>f[iS]&&normE(f[iS])===normE(docente));esSuplente=!!t;}
  if(!t)return null;
  return{sufijo:t[ix('TIEMPOS','SUFIJO')],tipo:t[ix('TIEMPOS','TIPO')],hs:t[ix('TIEMPOS','HS')],
    instrumento:t[ix('TIEMPOS','INSTRUMENTO')],fecha:t[ix('TIEMPOS','FECHA')],esSuplente};
}
/** Situación de revista más frecuente entre las designaciones del docente (para las tablas del acta). */
function situacionDeDocente(docente){
  const iDdoc=ix('DESIGNACIONES','DOCENTE'),iDsit=ix('DESIGNACIONES','SIT. REVISTA');
  const cont={};filas('DESIGNACIONES').forEach(f=>{if(f[iDdoc]&&normE(f[iDdoc])===normE(docente)){const s=f[iDsit]||'';cont[s]=(cont[s]||0)+1;}});
  const top=Object.entries(cont).sort((a,b)=>b[1]-a[1])[0];return top?top[0]:'';
}
/** Materia/especialidad del docente a partir de la columna TÍTULOS (si existe): toma los títulos de nivel
 *  "Secundaria-" y extrae lo que sigue a la última "EN " de cada uno. Si hay más de una titulación
 *  secundaria (doble título), intenta desambiguar contra el espacio de referencia de esta acta; si no
 *  puede, devuelve todas para que se revise a mano. Heurístico: siempre conviene chequear antes de firmar. */
function materiaDeDocente(docente,refEspacio){
  const d=filas('DOCENTES').find(f=>f[1]===docente);const iTit=ix('DOCENTES','TÍTULOS');
  const raw=(d&&iTit>-1)?String(d[iTit]||''):''; if(!raw)return '';
  const partes=raw.split(/(?=(?:Inicial|Primaria|Secundaria|Superior)-)/).map(s=>s.trim()).filter(Boolean);
  const secund=partes.filter(p=>/^Secundaria-/.test(p));
  const materias=secund.map(p=>{const idx=p.toUpperCase().lastIndexOf(' EN ');return idx>-1?p.slice(idx+4).replace(/\.$/,'').trim():'';}).filter(Boolean);
  if(!materias.length)return '';
  if(materias.length===1)return materias[0];
  if(refEspacio){const refN=normE(refEspacio);
    const match=materias.find(m=>{const mn=normE(m);return refN.includes(mn.slice(0,6))||mn.includes(refN.slice(0,6));});
    if(match)return match;}
  return materias.join(' y '); // doble titulación sin poder desambiguar: revisar a mano
}
/** CUPOF de origen del docente (DESIGNACIONES), separadas en las del tiempo (PTP/PTC) propio y las
 *  horas cátedra sueltas (PHC u otras sin sufijo de tiempo). */
function origenesDeDocente(docente,tiempo){
  const iDdoc=ix('DESIGNACIONES','DOCENTE'),iDcup=ix('DESIGNACIONES','CUPOF'),iDsit=ix('DESIGNACIONES','SIT. REVISTA');
  const iSuf=ix('CUPOF','SUFIJO TIEMPO');
  const cupIdx={};filas('CUPOF').forEach(c=>cupIdx[cupKey(c[0])]=c);
  const conTiempo=[],sueltas=[];
  filas('DESIGNACIONES').filter(f=>f[iDdoc]&&normE(f[iDdoc])===normE(docente)).forEach(f=>{
    const c=cupIdx[cupKey(f[iDcup])]; if(!c)return;
    const item={curso:c[ix('CUPOF','CURSO')],div:c[ix('CUPOF','DIV.')],carga:c[ix('CUPOF','CARGA')],
      espacio:c[ix('CUPOF','ESPACIO')],plan:c[ix('CUPOF','PLAN')],sit:f[iDsit],cupofTxt:c[0]};
    if(tiempo&&c[iSuf]===tiempo.sufijo)conTiempo.push(item);else sueltas.push(item);
  });
  return{conTiempo,sueltas};
}
/** Asignaciones nuevas del docente (ASIGNACIONES), separadas igual: las que provienen de CUPOF de su
 *  tiempo propio (el texto de origen incluye su sufijo) y las que provienen de horas sueltas. */
function destinosDeDocente(docente,tiempo){
  const iAp=ix('ASIGNACIONES','PLAN DESTINO'),iAc=ix('ASIGNACIONES','CURSO'),iAd=ix('ASIGNACIONES','DIV.'),iAt=ix('ASIGNACIONES','TURNO'),
    iAe=ix('ASIGNACIONES','ESPACIO DESTINO'),iAh=ix('ASIGNACIONES','HS'),iAcu=ix('ASIGNACIONES','CUPOF (texto origen)'),iAo=ix('ASIGNACIONES','OBS.');
  const cupIdx={};filas('CUPOF').forEach(c=>cupIdx[cupKey(c[0])]=c);
  const rows=asignacionesDelDocente(docente).map(x=>x.f);
  const conTiempo=[],sueltas=[];
  rows.forEach(a=>{
    const origTxt=String(a[iAcu]||'');
    const esDeTiempo=tiempo&&origTxt.includes(tiempo.sufijo);
    const tokens=origTxt.split(/\s+(?=0{0,4}\d?53200)/).filter(Boolean);
    const item={plan:a[iAp],curso:a[iAc],div:a[iAd],turno:a[iAt],espacio:a[iAe],hs:a[iAh],origen:origTxt,obs:a[iAo],
      origenes:tokens.map(tok=>{const c=cupIdx[cupKey(tok)];return{texto:tok.trim(),instrumento:c?c[ix('CUPOF','INSTRUMENTO')]:''};})};
    (esDeTiempo?conTiempo:sueltas).push(item);
  });
  return{conTiempo,sueltas};
}
/** Agrupa items de destino (uno por fila de ASIGNACIONES) por curso+div+espacio, para el acta: el espacio
 *  curricular debe aparecer UNA sola vez aunque esté financiado por más de una CUPOF (p.ej. dos parciales
 *  de la misma reasignación). Cada CUPOF que lo compone queda como una fila propia debajo (rowspan sobre
 *  curso/div/horas/situación/espacio), con su hs parcial en una columna aparte al final — la columna
 *  "horas" del grupo muestra la carga oficial de la estructura curricular (caja), no el valor de cada CUPOF. */
function agruparPorEspacio(items){
  const grupos=[], pos={};
  items.forEach(it=>{
    const key=[it.plan,it.curso,it.div,it.espacio].join('||');
    if(pos[key]===undefined){
      pos[key]=grupos.length;
      const planCorto=PLAN_MAP[it.plan]||it.plan;
      const m=matchEspacio(it.espacio,cajaDe(planCorto,it.curso,true));
      grupos.push({plan:it.plan,curso:it.curso,div:it.div,turno:it.turno,espacio:it.espacio,horasCaja:m?m.hs:'',items:[]});
    }
    grupos[pos[key]].items.push(it);
  });
  return grupos;
}
function actaHTML(docente){

  const{conTiempo:origConTiempo,sueltas:origSueltas}=origenesDeDocente(docente,tiempo);
  const{conTiempo:destConTiempo,sueltas:destSueltas}=destinosDeDocente(docente,tiempo);
  const sit=situacionDeDocente(docente);
  const espacioRef=(origConTiempo[0]||origSueltas[0]||{}).espacio||(destConTiempo[0]||destSueltas[0]||{}).espacio||'';
  const materia=materiaDeDocente(docente,espacioRef);
  const tratamiento=materia?`profesor/a de ${esc(materia)}`:'docente';
  const hsSueltas=sumHs(destSueltas);
  const filaOrigen=o=>`<tr><td>${esc(o.curso)}</td><td>${esc(o.div)}</td><td>${esc(o.carga)}</td><td>${esc(o.espacio)}/${esc(o.plan)}/${esc(sit)}/<span class="cup">${esc(o.cupofTxt)}</span></td></tr>`;
  const filaDestinoGrupo=g=>{const n=g.items.length;return g.items.map((it,j)=>`<tr>${j===0?
    `<td rowspan="${n}">${esc(g.curso)}</td><td rowspan="${n}">${esc(g.div)}</td><td rowspan="${n}">${esc(g.horasCaja)}</td><td rowspan="${n}">${esc(sit)}</td><td rowspan="${n}">${esc(g.espacio)}</td>`:''}
    <td class="cup">${esc(it.origen)}</td><td>${esc(it.hs)}</td></tr>`).join('');};
  const filaResumenTiempo=r=>`<tr><td class="cup">${esc(r.origen)}</td><td>${esc(r.espacio)}</td><td>${esc(r.hs)}</td><td>${esc(r.curso)}</td><td>${esc(r.div)}</td><td>${esc(r.turno||'')}</td></tr>`;
  const filaResumenSuelta=r=>`<tr><td class="cup">${r.origenes.map(o=>`${esc(o.texto)}${o.instrumento?'<br>'+esc(o.instrumento):''}`).join('<br>')}</td><td>${esc(r.espacio)}</td><td>${esc(r.hs)}</td><td>${esc(r.curso)}</td><td>${esc(r.div)}</td></tr>`;

  const bloqueTiempo=tiempo?`<p class="tiempoHead">${esc(tiempo.tipo)}-${esc(tiempo.hs)} horas- ${esc(tiempo.instrumento)}</p>
   <table><tr><th>CURSO</th><th>DIV</th><th>CARGA HORARIA</th><th>ESPACIO CURRICULAR/PLAN DE ESTUDIO/SITUACIÓN DE REVISTA Y CUPOF</th></tr>
   ${origConTiempo.map(filaOrigen).join('')||'<tr><td colspan="4">(sin datos)</td></tr>'}</table>`:'';
  const bloqueSueltas=origSueltas.length?`<p style="font-weight:bold;margin:10px 0 4px">HORAS CÁTEDRAS</p>
   <table><tr><th>CURSO</th><th>DIV</th><th>CARGA HORARIA</th><th>ESPACIO CURRICULAR/PLAN DE ESTUDIO/SITUACIÓN DE REVISTA Y CUPOF</th></tr>
   ${origSueltas.map(filaOrigen).join('')}</table>`:'';
  const aceptaTiempo=destConTiempo.length?`<p>A tal efecto ACEPTA DESEMPEÑARSE en los espacios curriculares ${RES_MARCO}</p>
   <table><tr><th>curso</th><th>DIV</th><th>horas</th><th>Sit.de revista</th><th>Espacio Curricular actual</th><th>CUPOF</th><th>hs</th></tr>
   ${agruparPorEspacio(destConTiempo).map(filaDestinoGrupo).join('')}</table>`:'';
  const aceptaSueltas=destSueltas.length?`<p>A tal efecto ACEPTA DESEMPEÑARSE en los espacios curriculares ${RES_MARCO}</p>
   <table><tr><th>CURSO</th><th>DIV</th><th>CARGA HORA</th><th>SIT. REVISTA</th><th>Curso actual</th><th>CUPOF</th><th>hs</th></tr>
   ${agruparPorEspacio(destSueltas).map(filaDestinoGrupo).join('')}</table>`:'';
  const resumenTiempo=destConTiempo.length?`<table><tr><th>CUPOF:HISTÓRICAS</th><th>REASIGNADO EN</th><th>hs</th><th>curso</th><th>DIV</th><th>TURNO</th></tr>
   ${destConTiempo.map(filaResumenTiempo).join('')}</table>`:'';
  const resumenSueltas=destSueltas.length?`<p>Y la reasignación de ${numALetras(hsSueltas)} (${hsSueltas}) horas cátedra${destSueltas[0]?` al ${esc(destSueltas[0].plan)}`:''} ${RES_MARCO}</p>
   <table><tr><th>CUPOF-Resolución</th><th>REASIGNADO</th><th>HORAS</th><th>CURSO</th><th>DIV</th></tr>
   ${destSueltas.map(filaResumenSuelta).join('')}</table>`:'';

  return `<h1>ACTA DE ACUERDO REASIGNACIÓN DE FUNCIONES</h1>
  <p>En la localidad de ${LOCALIDAD} a los ………. días del mes de ${esc(fecha)}, comparece en la Dirección de la EPES Nº 14 el/la ${tratamiento} <b>${esc(docente)}</b>, DNI N°: <b>${dni}</b>, quien acepta, en el marco de ${LEY_MARCO}, desempeñarse desde la toma de posesión en las horas reubicadas, con una propuesta pedagógica enmarcada en los objetivos establecidos en la ${RES_MARCO}, en los siguientes espacios curriculares:</p>
  ${bloqueTiempo}${bloqueSueltas}${aceptaTiempo}${aceptaSueltas}
  <p class="salto"></p>
  <p style="text-align:right"><b>${LOCALIDAD}</b></p>
  <p><b>VISTO: </b>La necesidad de reorganizar la POF de la escuela, y reasignar horas de los CUPOF y las plazas correspondientes, a la estructura curricular vigente por ${RES_MARCO}; y</p>
  <p><b>CONSIDERANDO:</b></p>
  <p>Que es necesario reasignar los CUPOF y las plazas a la nueva estructura curricular aprobada por ${RES_MARCO}.</p>
  <p>Que la misma se procederá a realizar por medio de Actas de Acuerdo y Disposiciones AD referéndum de la Dirección de Nivel Secundario a través de las cuales el/la docente acepta la reubicación de las horas cátedra en que se encontraba designado/a, a las vigentes según el Plan de estudios contemplado en la resolución citada en el visto;</p>
  <p>Que por este instrumento legal se validará la reasignación ${tiempo?`del ${esc(tiempo.tipo)} ${esc(tiempo.hs)} hs.`:'de horas cátedra'} del/de la ${tratamiento} <b>${esc(docente)}</b> -DNI N°: ${dni} a horas cátedras del Plan de estudios vigente.</p>
  <p>Que corresponde dictar el acto administrativo pertinente que efectivice la medida tomada;</p>
  <p>Por ello;</p>
  <p style="text-align:center;font-weight:bold">${DIRECTORA}</p>
  <p style="text-align:center;font-weight:bold">DISPONE:</p>
  <p><b>ARTICULO 1º:</b> Autorizase, ad referéndum de la Dirección de Educación Secundaria, a partir de la Presente, la reasignación ${tiempo?`del ${esc(tiempo.tipo)} de ${esc(tiempo.hs)} hs.`:'de horas cátedra'} del/de la ${tratamiento} <b>${esc(docente)}</b> -DNI N°: ${dni} según se detalla:</p>
  ${resumenTiempo}${resumenSueltas}
  <p>-SUJETO A APLICACIÓN DE ART. 21-</p>
  <p><b>ARTICULO 2º:</b> Regístrese. Comuníquese a quienes corresponda. Notifíquese y archívese.</p>
  <p>DISPOSICIÓN Nº _________/</p>
  <p>NOTIFICADO: …………………………………………………</p>`;
}
function envolver(cuerpo){return `<html><head><meta charset="utf-8"><style>${ACTA_CSS}</style></head><body>${cuerpo}</body></html>`;}
function bajarDoc(nombre,html){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+html],{type:'application/msword'}));a.download=nombre;a.click();}
function bajarPDF(nombre,html){
  if(typeof html2pdf==='undefined')return msg('No cargó la librería de PDF');
  const el=document.createElement('div');el.innerHTML=`<style>${ACTA_CSS}</style>`+html;
  html2pdf().set({filename:nombre,margin:[10,10],jsPDF:{unit:'mm',format:'a4'},html2canvas:{scale:2}}).from(el).save();
}
function docentesConDestino(){
  return filas('DOCENTES').map(f=>f[1]).filter(n=>asignacionesDelDocente(n).length>0).sort();
}
function genActa(fmt){
  const doc=document.getElementById('gDoc').value;
  const html=actaHTML(doc);
  if(fmt==='doc')bajarDoc(`Acta Acuerdo y Disposicion - ${doc}.doc`,envolver(html));
  else bajarPDF(`Acta Acuerdo y Disposicion - ${doc}.pdf`,html);
  msg('Acta generada: '+doc);
}
function genActasTodas(fmt){
  const lst=docentesConDestino();
  if(!confirm(`Se generará UN archivo con ${lst.length} actas (docentes con asignaciones). ¿Continuar?`))return;
  const cuerpo=lst.map((d,i)=>`${i?'<div class="salto"></div>':''}${actaHTML(d)}`).join('');
  if(fmt==='doc')bajarDoc('Actas Acuerdo y Disposicion - TODAS.doc',envolver(cuerpo));
  else bajarPDF('Actas Acuerdo y Disposicion - TODAS.pdf',cuerpo);
  msg('Generadas '+lst.length+' actas en un solo archivo');
}

/* ============ AUDITORÍA ============ */
async function rAuditoria(){
  const v=document.getElementById('v-auditoria');
  const j=await apiGet({action:'bd',token:TOKEN});BD=j.bd;
  const rows=(BD['AUDITORIA']?.filas||[]).slice(-300).reverse();
  v.innerHTML=`<div class="card"><h2>Auditoría (últimos ${rows.length})</h2>
   <div class="tabla-wrap"><table><tr>${(BD['AUDITORIA']?.cols||[]).map(c=>`<th>${esc(c)}</th>`).join('')}</tr>
   ${rows.map(f=>`<tr>${f.map(c=>`<td>${esc(String(c)).slice(0,160)}</td>`).join('')}</tr>`).join('')}</table></div></div>`;
}
